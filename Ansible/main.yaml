---
- name: configure and start nginx web server
  hosts: webservers
  become: true

  tasks:
    - name: ensure nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    -name: stop and disable nginx service
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: false    