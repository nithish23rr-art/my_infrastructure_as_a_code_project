---
- name: Comprehensive enterprise web server configuration
  hosts: webservers
  gather_facts: true
  become: true

  vars:
    app_user: deployer
    app_packages:
      - nginx
      - git
      - curl
    service_name: nginx

  pre_tasks:
    - name: Update apt repository cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - name: Create application system user
      ansible.builtin.user:
        name: "{{ app_user }}"
        state: present
        shell: /bin/bash
        system: true

    - name: Install application core packages
      ansible.builtin.apt:
        name: "{{ app_packages }}"
        state: present
      notify: Restart web service

    - name: Deploy application configuration files
      block:
        - name: Ensure web root directory exists
          ansible.builtin.file:
            path: /var/www/html
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Write HTML index page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: |
              Welcome to the manager of the web server!
              Hostname: {{ ansible_hostname | default('unknown') }}
              IP address: {{ ansible_default_ipv4.address | default('unknown') }}
            owner: root
            group: root
            mode: "0644"
          notify: Restart web service

      rescue:
        - name: Log configuration failure
          ansible.builtin.debug:
            msg: "Failed to deploy configuration files; entering rescue stage."

      always:
        - name: Run cleanup or audit logging tasks
          ansible.builtin.debug:
            msg: "Finished configuration block attempt for {{ service_name }}."

  handlers:
    - name: Restart web service
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: restarted
