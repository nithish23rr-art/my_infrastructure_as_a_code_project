---
-name: comprehensive enterprise web server configuration
 hosts: webservers
 gather_facts: true
 become: true

 vars:
 app_user: "deployer"
 app_pakage:
    - name: "nginx"
    - name: "git"
    - name: "curl"

    service_name:
      - name: "nginx"

      pre_tasks:
        - name: update apt repo cache
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600

tasks:
  - name: create application system user
    ansible.builtin.user:
      name: "{{ app_user }}"
      state: present
      shell: /bin/bash
      system: yes

  - name: create application core packages
    ansible.builtin.apt:
      name: "{{ item.name }}"
      state: present
    loop: "{{ app_pakage }}"
    notify: restart service

  - name: deploy application configuration files
    ansible.builtin.template:
    bloke:
    -name: write html index page
      ansible.builtin.template:
        src: templates/index.html
        ansible.builtin.copy:
        dest: /var/www/html/index.html
         contevt:|
         welcome to the manager of the web server!
         hostname: {{ ansible_hostname }}
         ip address: {{ ansible_default_ipv4.address }}
         mode: '0644'
         rescue:
         -name:log confriguration failed
          ansible.builtin.debug:
            msg: "Failed to deploy configuration files,exiting rescue stage."
            always: 
            name: always run cleanup or audit logging tasks
            ansible.builtin.debug:
              msg: "finished bloke attempt for {{service_name}} configuration."
       handler:
      - name: restart service
      ansible.builtin.systemd:
      name:"{{service_name  }}" 
      state: restarted 
 ...    

       